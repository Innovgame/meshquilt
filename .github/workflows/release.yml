name: Release

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            publish:
                description: Publish to npm and GitHub Packages after validation (default is dry run)
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    group: npm-release
    cancel-in-progress: false

jobs:
    package:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        outputs:
            npm_tag: ${{ steps.metadata.outputs.npm_tag }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Validate tag and select release commit
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  if [[ "$GITHUB_REF_TYPE" != tag ]]; then
                      echo "Select the release tag under 'Use workflow from' when starting this workflow."
                      exit 1
                  fi
                  [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
                  git show-ref --verify "refs/tags/$RELEASE_TAG"
                  git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" origin/main
                  # The workflow ref is the release tag, so npm provenance identifies its commit.
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm test
            - run: pnpm test:release
            - run: pnpm test:packages
            - name: Verify browser Workers
              run: |
                  pnpm --filter meshquilt exec playwright install --with-deps chromium
                  pnpm test:workers:built
            - name: Validate version and prepare actual repository metadata
              id: metadata
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: pnpm release:check "$RELEASE_TAG" --prepare
            - name: Pack the validated library
              run: |
                  mkdir -p release-artifact
                  pnpm --filter meshquilt --config.ignore-scripts=true pack --pack-destination "$GITHUB_WORKSPACE/release-artifact"
            - name: Prepare the GitHub Packages archive
              run: |
                  owner="$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
                  node scripts/github-packages-tarball.mjs release-artifact/meshquilt-*.tgz release-artifact/github-packages.tgz "$owner"
            - uses: actions/upload-artifact@v7
              with:
                  name: npm-package
                  path: |
                      release-artifact/meshquilt-*.tgz
                      release-artifact/github-packages.tgz
                  if-no-files-found: error
            - name: Dry-run npm publish
              run: npm publish --dry-run --access public ./release-artifact/meshquilt-*.tgz

    publish:
        if: inputs.publish || github.event_name == 'release'
        needs: package
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: npm-release
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - uses: actions/download-artifact@v8
              with:
                  name: npm-package
                  path: release-artifact
            - name: Publish meshquilt to npm
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_TAG: ${{ needs.package.outputs.npm_tag }}
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  tarballs=(release-artifact/meshquilt-*.tgz)
                  if [[ ${#tarballs[@]} -ne 1 ]]; then
                      echo "Expected one npm archive." >&2
                      exit 1
                  fi
                  version="$(tar -xOf "${tarballs[0]}" package/package.json | node -e 'let source=""; process.stdin.on("data", (chunk) => source += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(source).version));')"
                  if npm publish --access public --provenance --tag "$NPM_TAG" "./${tarballs[0]}"; then
                      echo "Published meshquilt@${version} to npm."
                  elif npm view "meshquilt@${version}" version >/dev/null 2>&1; then
                      echo "meshquilt@${version} is already on npm."
                  else
                      echo "Failed to publish meshquilt@${version} to npm." >&2
                      exit 1
                  fi

    publish-github:
        if: inputs.publish || github.event_name == 'release'
        needs: package
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: npm-release
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: npm-package
                  path: release-artifact
            - name: Publish @owner/meshquilt to GitHub Packages
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  owner="$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
                  name="@${owner}/meshquilt"
                  version="$(tar -xOf release-artifact/github-packages.tgz package/package.json | node -e 'let source=""; process.stdin.on("data", (chunk) => source += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(source).version));')"
                  printf '@%s:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$owner" "$NODE_AUTH_TOKEN" >"$HOME/.npmrc"
                  if npm publish --access public --ignore-scripts --registry https://npm.pkg.github.com ./release-artifact/github-packages.tgz; then
                      echo "Published ${name}@${version} to GitHub Packages."
                  elif npm view "${name}@${version}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
                      echo "${name}@${version} is already on GitHub Packages."
                  else
                      echo "Failed to publish ${name}@${version} to GitHub Packages." >&2
                      exit 1
                  fi
