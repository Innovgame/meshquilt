name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: check (Node ${{ matrix.node }})
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24, 26]
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Check format, lint, and types
              run: pnpm check

            - name: Test
              run: pnpm test

            - name: Verify release guards
              run: pnpm test:release

            - name: Build
              run: pnpm build

            - name: Verify packed exports and declarations
              run: pnpm test:packages

            - name: Install browser for Worker integration
              if: matrix.node == 22
              run: pnpm --filter meshquilt exec playwright install --with-deps chromium

            - name: Verify real Draco Workers
              if: matrix.node == 22
              run: pnpm test:workers
