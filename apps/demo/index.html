<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MeshQuilt</title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <header>
            <p class="kicker">browser mesh codec</p>
            <h1>MeshQuilt</h1>
            <p class="lede">把 <code>THREE.Mesh</code> 切成块。块与块共用量化范围，解码后按块绘制，接缝仍然对齐。</p>
        </header>
        <main>
            <section class="stage" id="stage"></section>
            <aside>
                <label>
                    每块最多三角面
                    <input id="maxTriangles" type="range" min="200" max="4000" step="200" value="1200" />
                    <output id="maxTrianglesOut">1200</output>
                </label>
                <div class="actions">
                    <button id="split" type="button">按块绘制</button>
                    <button id="solid" type="button">整块显示</button>
                </div>
                <dl id="stats"></dl>
                <p class="note">
                    3MF、glTF、STL 先装成 Mesh，再交给 MeshQuilt。Draco 压缩接在
                    <code>encodeChunk</code> 上，不绑死某一种文件格式。
                </p>
            </aside>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
